[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Lista-operacional"
version = "0.1.0"
description = "Ferramenta especifica que recebe e valida dados de estoque."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[tool.hatch.envs.test]
dependencies_options = ["pytest"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
